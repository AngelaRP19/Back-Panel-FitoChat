name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: ruff (lint y formato)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy (estricto en core y modules)
        run: mypy app

      # Misma imagen que en desarrollo: PostgreSQL 16 con PostGIS y pgvector.
      - name: Levantar PostgreSQL
        run: docker compose up -d --build --wait db

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://anuc:anuc_local@localhost:5432/anuc_test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: calidad-y-pruebas
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t anuc-backend:ci .

      - name: Comprobar que arranca y responde /salud
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=local \
            -e DATABASE_URL=postgresql+psycopg://u:p@localhost:5432/anuc_db \
            -e SQS_QUEUE_URL=http://localhost:4566/000000000000/mensajes-entrantes.fifo \
            -e WHATSAPP_VERIFY_TOKEN=ci -e WHATSAPP_APP_SECRET=ci \
            anuc-backend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/salud && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Comprobar que la imagen trae las migraciones
        run: |
          docker run --rm --entrypoint alembic \
            -e DATABASE_URL=postgresql+psycopg://u:p@localhost:5432/anuc_db \
            anuc-backend:ci heads
