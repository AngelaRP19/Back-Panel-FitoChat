# I-20 (SQA): avisos y pull requests semanales para actualizar dependencias vulnerables o viejas.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
